name: Native TUN Preflight
on:
  workflow_dispatch:
  push:
    branches: [codex/nodes-tun-routing]
    paths:
      - .github/workflows/network-preflight.yml
      - scripts/network-preflight.mjs
      - scripts/macos-service-preflight.mjs
      - scripts/macos-service-preflight.swift
permissions:
  contents: read
concurrency:
  group: sing-shell-network-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - id: matrix
        run: node scripts/ci-matrix.mjs
  native:
    needs: select
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Native privileged TUN preflight (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          SING_SHELL_NETWORK_PREFLIGHT: '1'
        run: node scripts/network-preflight.mjs ${{ matrix.target }}
      - name: macOS native helper registration
        if: runner.os == 'macOS'
        env:
          SING_SHELL_NETWORK_PREFLIGHT: '1'
        run: node scripts/macos-service-preflight.mjs
      - name: Native privileged TUN preflight (Unix)
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          SING_SHELL_NETWORK_PREFLIGHT: '1'
        run: sudo -E "$(which node)" scripts/network-preflight.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: network-preflight-${{ matrix.target }}
          path: artifacts/network-preflight/**/report.json
          if-no-files-found: warn
