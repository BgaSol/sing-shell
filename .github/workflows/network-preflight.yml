name: Native TUN Preflight
on:
  workflow_dispatch:
  push:
    branches: [main, codex/platform-network-lifecycle]
    paths:
      - .github/workflows/network-preflight.yml
      - scripts/network-preflight.mjs
      - scripts/network-integration.mjs
      - scripts/network-echo.mjs
      - src-tauri/src/**
      - src-tauri/tests/fixtures/network.rs
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
permissions:
  contents: read
concurrency:
  group: sing-shell-network-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - id: matrix
        run: node scripts/ci-matrix.mjs
  native:
    needs: select
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Native privileged TUN preflight (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          SING_SHELL_NETWORK_PREFLIGHT: '1'
        run: node scripts/network-preflight.mjs ${{ matrix.target }}
      - name: Native privileged TUN preflight (Unix)
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          SING_SHELL_NETWORK_PREFLIGHT: '1'
        run: sudo -E "$(which node)" scripts/network-preflight.mjs ${{ matrix.target }}
      - name: TUN bypass DNS prerequisite (Windows)
        if: runner.os == 'Windows'
        env:
          SING_SHELL_NETWORK_PREFLIGHT: '1'
        run: node scripts/bypass-preflight.mjs ${{ matrix.target }}
      - name: TUN bypass DNS prerequisite (Unix)
        if: runner.os != 'Windows'
        env:
          SING_SHELL_NETWORK_PREFLIGHT: '1'
        run: sudo -E "$(which node)" scripts/bypass-preflight.mjs ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: src-tauri -> target
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - run: npm ci
      - run: npm run web:build
      - run: cargo build --release --manifest-path src-tauri/Cargo.toml --features test-fixtures --bin network-fixture --locked
      - name: Official core Fake-IP and verified TLS contract
        run: node scripts/fakeip-check.mjs ${{ matrix.target }}
      - name: Production worker and generated TUN integration (Windows)
        if: runner.os == 'Windows'
        env:
          SING_SHELL_NETWORK_PREFLIGHT: '1'
        run: node scripts/network-integration.mjs ${{ matrix.target }}
      - name: Production worker and generated TUN integration (Unix)
        if: runner.os != 'Windows'
        env:
          SING_SHELL_NETWORK_PREFLIGHT: '1'
        run: sudo -E "$(which node)" scripts/network-integration.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: network-preflight-${{ matrix.target }}
          path: |
            artifacts/network-preflight/**/*report.json
            artifacts/network-preflight/**/service-diagnostics.log
            fakeip-*-report.json
          if-no-files-found: warn
