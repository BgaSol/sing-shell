name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - id: matrix
        run: node scripts/ci-matrix.mjs
  native:
    needs: select
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.verifyRunner || matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: src-tauri -> target
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf xvfb dbus-x11 openbox
      - name: Require native architecture
        env:
          EXPECTED_RUST_TARGET: ${{ matrix.target }}
        run: node -e "const {execFileSync}=require('node:child_process'); const actual=execFileSync('rustc',['-vV'],{encoding:'utf8'}).match(/^host\x3a (.+)$/m)?.[1]; if(actual!==process.env.EXPECTED_RUST_TARGET) throw Error('native host mismatch '+actual)"
      - run: npm ci
      - run: npm run check
      - run: npm run scripts:test
      - run: npm run web:build
      - run: npm run test
      - if: runner.os != 'macOS'
        run: npm run build -- --no-bundle -- --locked
      - if: runner.os == 'macOS'
        run: npm run build -- --bundles app -- --locked
      - name: Smoke (Linux)
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: dbus-run-session -- xvfb-run -a sh -c 'openbox >/dev/null 2>&1 & node scripts/smoke.mjs'
      - name: Smoke (Windows)
        if: runner.os == 'Windows'
        run: node scripts/smoke.mjs
      - name: Smoke (macOS bundle)
        if: runner.os == 'macOS'
        run: node scripts/smoke.mjs "src-tauri/target/release/bundle/macos/Sing Shell.app/Contents/MacOS/sing-shell"
